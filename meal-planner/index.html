<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>献立管理</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--fg:#2b2a28;--muted:#77736c;--line:#e6e1d8;--accent:#c8553d;--accent2:#f3e3dd;--ok:#3d8c5a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a19;--card:#252422;--fg:#ece9e4;--muted:#a19c94;--line:#3a3835;--accent:#e07a5f;--accent2:#3a2a25;--ok:#6cbf8a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
h1{font-size:1.2rem;margin:0;padding:12px 0 6px}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{border:0;background:none;color:var(--muted);padding:8px 12px;font:inherit;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.active{color:var(--accent);border-color:var(--accent);font-weight:600}
main{padding:16px 0 48px}
section{display:none}section.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
textarea{width:100%;min-height:70px}
button.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:6px 12px;cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.small{padding:2px 8px;font-size:.85rem}
.muted{color:var(--muted);font-size:.9rem}
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow-x:auto}
@media (max-width:760px){.week{grid-template-columns:1fr}}
.day{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day h3{margin:0 0 6px;font-size:.95rem}
.slot{margin-bottom:8px}.slot label{display:block;font-size:.75rem;color:var(--muted)}
.slot select{width:100%}
.tag{display:inline-block;background:var(--accent2);color:var(--accent);border-radius:99px;padding:0 8px;font-size:.75rem;margin-right:4px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.done{text-decoration:line-through;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}.field input,.field select{width:100%}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>🍱 献立管理</h1>
  <nav id="tabs">
    <button data-tab="plan" class="active">週間献立</button>
    <button data-tab="dishes">料理リスト</button>
    <button data-tab="shop">買い物リスト</button>
    <button data-tab="data">データ</button>
  </nav>
</div></header>

<main class="wrap">
  <section id="plan" class="active">
    <div class="row" style="margin-bottom:12px">
      <button class="btn" id="prevWeek">◀ 前週</button>
      <strong id="weekLabel"></strong>
      <button class="btn" id="nextWeek">次週 ▶</button>
      <button class="btn" id="thisWeek">今週</button>
      <span style="flex:1"></span>
      <button class="btn" id="autoFill">🎲 空欄をおまかせで埋める</button>
      <button class="btn" id="clearWeek">この週をクリア</button>
    </div>
    <div class="week" id="week"></div>
  </section>

  <section id="dishes">
    <div class="grid2">
      <div class="card">
        <h2 style="margin-top:0;font-size:1rem" id="formTitle">料理を追加</h2>
        <form id="dishForm">
          <input type="hidden" id="dishId">
          <div class="field"><label>料理名</label><input id="dishName" required placeholder="例：肉じゃが"></div>
          <div class="field"><label>カテゴリ</label>
            <select id="dishCat"><option>主菜</option><option>副菜</option><option>汁物</option><option>主食</option><option>麺類</option><option>丼もの</option><option>その他</option></select></div>
          <div class="field"><label>材料（1行に1つ。「材料名 分量」の形式）</label><textarea id="dishIng" placeholder="じゃがいも 3個&#10;牛肉 200g&#10;玉ねぎ 1個"></textarea></div>
          <div class="field"><label>メモ・作り方</label><textarea id="dishMemo"></textarea></div>
          <div class="row"><button class="btn primary" type="submit">保存</button><button class="btn" type="button" id="cancelEdit">キャンセル</button></div>
        </form>
      </div>
      <div class="card">
        <div class="row" style="margin-bottom:8px">
          <input id="dishSearch" placeholder="検索" style="flex:1">
          <select id="dishFilter"><option value="">すべて</option><option>主菜</option><option>副菜</option><option>汁物</option><option>主食</option><option>麺類</option><option>丼もの</option><option>その他</option></select>
        </div>
        <ul class="list" id="dishList"></ul>
      </div>
    </div>
  </section>

  <section id="shop">
    <div class="card">
      <div class="row" style="margin-bottom:8px">
        <strong id="shopLabel"></strong><span style="flex:1"></span>
        <button class="btn small" id="copyShop">コピー</button>
        <button class="btn small" id="resetShop">チェックを外す</button>
      </div>
      <p class="muted" style="margin-top:0">「週間献立」で表示中の週の料理から材料を集計しています。</p>
      <ul class="list" id="shopList"></ul>
      <form class="row" id="extraForm" style="margin-top:10px"><input id="extraItem" placeholder="その他に買うもの" style="flex:1"><button class="btn">追加</button></form>
    </div>
  </section>

  <section id="data">
    <div class="card">
      <h2 style="margin-top:0;font-size:1rem">バックアップ</h2>
      <p class="muted">データはこのブラウザ（localStorage）に保存されます。</p>
      <div class="row">
        <button class="btn" id="exportBtn">JSONを書き出す</button>
        <label class="btn" style="cursor:pointer">JSONを読み込む<input type="file" id="importFile" accept="application/json" hidden></label>
        <button class="btn" id="resetAll">全データ削除</button>
      </div>
    </div>
  </section>
</main>

<script>
const KEY='mealPlanner.v1';
const MEALS=[['b','朝食'],['l','昼食'],['d','夕食']];
const WD=['日','月','火','水','木','金','土'];
const SAMPLE=[
 {name:'肉じゃが',cat:'主菜',ing:['じゃがいも 3個','牛肉 200g','玉ねぎ 1個','にんじん 1本']},
 {name:'鮭の塩焼き',cat:'主菜',ing:['鮭 2切れ']},
 {name:'鶏の照り焼き',cat:'主菜',ing:['鶏もも肉 1枚','醤油','みりん']},
 {name:'麻婆豆腐',cat:'主菜',ing:['豆腐 1丁','豚ひき肉 150g','長ねぎ 1本']},
 {name:'カレーライス',cat:'丼もの',ing:['じゃがいも 2個','玉ねぎ 2個','にんじん 1本','豚肉 300g','カレールー']},
 {name:'ほうれん草のおひたし',cat:'副菜',ing:['ほうれん草 1束']},
 {name:'味噌汁',cat:'汁物',ing:['豆腐 1丁','わかめ','味噌']},
 {name:'トーストと目玉焼き',cat:'主食',ing:['食パン 2枚','卵 2個']},
 {name:'焼きそば',cat:'麺類',ing:['焼きそば麺 2玉','キャベツ 1/4個','豚肉 150g']},
];
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.dishes)return s}catch(e){}
  return {dishes:SAMPLE.map(d=>({...d,id:uid(),memo:''})),plan:{},checked:{},extras:{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,10)}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
let ws=weekStart(new Date());
const days=()=>Array.from({length:7},(_,i)=>{const d=new Date(ws);d.setDate(d.getDate()+i);return d});
const wkey=()=>ymd(ws);
const dish=id=>S.dishes.find(d=>d.id===id);

// tabs
$('#tabs').onclick=e=>{const t=e.target.dataset.tab;if(!t)return;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('active',s.id===t));render()};

function renderWeek(){
  const ds=days(),today=ymd(new Date());
  $('#weekLabel').textContent=`${ds[0].getMonth()+1}/${ds[0].getDate()} 〜 ${ds[6].getMonth()+1}/${ds[6].getDate()}`;
  const opts=S.dishes.slice().sort((a,b)=>a.cat.localeCompare(b.cat)||a.name.localeCompare(b.name,'ja'));
  $('#week').innerHTML=ds.map(d=>{const k=ymd(d),p=S.plan[k]||{};
    return `<div class="day ${k===today?'today':''}"><h3>${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）</h3>`+
    MEALS.map(([m,label])=>`<div class="slot"><label>${label}</label>`+
      (p[m]||[]).map((id,i)=>{const x=dish(id);return x?`<div class="row" style="gap:4px;margin:2px 0"><span class="tag">${esc(x.cat)}</span><span style="flex:1">${esc(x.name)}</span><button class="btn small" data-rm="${k}|${m}|${i}" title="外す">×</button></div>`:''}).join('')+
      `<select data-add="${k}|${m}"><option value="">＋ 追加</option>${opts.map(o=>`<option value="${o.id}">[${esc(o.cat)}] ${esc(o.name)}</option>`).join('')}</select></div>`).join('')+
    `</div>`}).join('');
}
$('#week').addEventListener('change',e=>{const a=e.target.dataset.add;if(!a||!e.target.value)return;
  const [k,m]=a.split('|');S.plan[k]??={};(S.plan[k][m]??=[]).push(e.target.value);save();render()});
$('#week').addEventListener('click',e=>{const r=e.target.dataset.rm;if(!r)return;
  const [k,m,i]=r.split('|');S.plan[k][m].splice(+i,1);save();render()});
$('#prevWeek').onclick=()=>{ws.setDate(ws.getDate()-7);render()};
$('#nextWeek').onclick=()=>{ws.setDate(ws.getDate()+7);render()};
$('#thisWeek').onclick=()=>{ws=weekStart(new Date());render()};
$('#clearWeek').onclick=()=>{if(!confirm('この週の献立をすべて消しますか？'))return;days().forEach(d=>delete S.plan[ymd(d)]);save();render()};
$('#autoFill').onclick=()=>{
  const pick=f=>{const c=S.dishes.filter(f);return c.length?c[Math.floor(Math.random()*c.length)].id:null};
  const main=d=>['主菜','丼もの','麺類'].includes(d.cat);
  const used=new Set();
  days().forEach(d=>{const k=ymd(d);S.plan[k]??={};
    ['l','d'].forEach(m=>{if((S.plan[k][m]||[]).length)return;
      const id=pick(x=>main(x)&&!used.has(x.id))||pick(main);if(id){used.add(id);S.plan[k][m]=[id];
        if(m==='d'){const s=pick(x=>x.cat==='副菜'||x.cat==='汁物');if(s)S.plan[k][m].push(s)}}});
    if(!(S.plan[k].b||[]).length){const id=pick(x=>x.cat==='主食');if(id)S.plan[k].b=[id]}});
  save();render()};

// dishes
function renderDishes(){
  const q=$('#dishSearch').value.trim(),f=$('#dishFilter').value;
  const list=S.dishes.filter(d=>(!f||d.cat===f)&&(!q||d.name.includes(q)||d.ing.join(' ').includes(q)))
    .sort((a,b)=>a.name.localeCompare(b.name,'ja'));
  $('#dishList').innerHTML=list.length?list.map(d=>`<li><div><span class="tag">${esc(d.cat)}</span><strong>${esc(d.name)}</strong>
    <div class="muted">${esc(d.ing.join('・'))||'材料未登録'}</div>${d.memo?`<div class="muted">📝 ${esc(d.memo)}</div>`:''}</div>
    <div class="row" style="flex-wrap:nowrap"><button class="btn small" data-edit="${d.id}">編集</button><button class="btn small" data-del="${d.id}">削除</button></div></li>`).join('')
    :'<li class="muted">料理がありません</li>';
}
$('#dishSearch').oninput=renderDishes;$('#dishFilter').onchange=renderDishes;
function resetForm(){$('#dishForm').reset();$('#dishId').value='';$('#formTitle').textContent='料理を追加'}
$('#cancelEdit').onclick=resetForm;
$('#dishForm').onsubmit=e=>{e.preventDefault();
  const d={name:$('#dishName').value.trim(),cat:$('#dishCat').value,ing:$('#dishIng').value.split('\n').map(s=>s.trim()).filter(Boolean),memo:$('#dishMemo').value.trim()};
  if(!d.name)return;const id=$('#dishId').value;
  if(id)Object.assign(dish(id),d);else S.dishes.push({...d,id:uid()});
  save();resetForm();render()};
$('#dishList').onclick=e=>{const {edit,del}=e.target.dataset;
  if(edit){const d=dish(edit);$('#dishId').value=d.id;$('#dishName').value=d.name;$('#dishCat').value=d.cat;$('#dishIng').value=d.ing.join('\n');$('#dishMemo').value=d.memo||'';$('#formTitle').textContent='料理を編集';$('#dishName').focus()}
  if(del&&confirm(`「${dish(del).name}」を削除しますか？（献立からも外れます）`)){
    S.dishes=S.dishes.filter(d=>d.id!==del);
    for(const k in S.plan)for(const m in S.plan[k])S.plan[k][m]=S.plan[k][m].filter(x=>x!==del);
    save();render()}};

// shopping
function shopItems(){
  const map=new Map();
  days().forEach(d=>{const p=S.plan[ymd(d)]||{};MEALS.forEach(([m])=>(p[m]||[]).forEach(id=>{const x=dish(id);if(!x)return;
    x.ing.forEach(line=>{const [name,...rest]=line.split(/\s+/);const e=map.get(name)||{name,qty:[],from:new Set()};
      if(rest.length)e.qty.push(rest.join(' '));e.from.add(x.name);map.set(name,e)})}))});
  (S.extras[wkey()]||[]).forEach(n=>{if(!map.has(n))map.set(n,{name:n,qty:[],from:new Set(['追加'])})});
  return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'ja'));
}
function renderShop(){
  const ds=days();$('#shopLabel').textContent=`${ds[0].getMonth()+1}/${ds[0].getDate()}〜${ds[6].getMonth()+1}/${ds[6].getDate()} の買い物`;
  const ck=S.checked[wkey()]||{},items=shopItems();
  $('#shopList').innerHTML=items.length?items.map(i=>`<li><label class="row ${ck[i.name]?'done':''}" style="flex:1;cursor:pointer">
    <input type="checkbox" data-ck="${esc(i.name)}" ${ck[i.name]?'checked':''}><span><strong>${esc(i.name)}</strong> ${esc(i.qty.join(' + '))}
    <span class="muted">（${esc([...i.from].join('、'))}）</span></span></label>
    ${i.from.has('追加')?`<button class="btn small" data-rmx="${esc(i.name)}">×</button>`:''}</li>`).join('')
    :'<li class="muted">この週の献立がまだありません</li>';
}
$('#shopList').onchange=e=>{const n=e.target.dataset.ck;if(n==null)return;(S.checked[wkey()]??={})[n]=e.target.checked;save();renderShop()};
$('#shopList').onclick=e=>{const n=e.target.dataset.rmx;if(n==null)return;S.extras[wkey()]=(S.extras[wkey()]||[]).filter(x=>x!==n);save();renderShop()};
$('#extraForm').onsubmit=e=>{e.preventDefault();const v=$('#extraItem').value.trim();if(!v)return;(S.extras[wkey()]??=[]).push(v);$('#extraItem').value='';save();renderShop()};
$('#resetShop').onclick=()=>{S.checked[wkey()]={};save();renderShop()};
$('#copyShop').onclick=()=>{const ck=S.checked[wkey()]||{};const t=shopItems().filter(i=>!ck[i.name]).map(i=>`・${i.name} ${i.qty.join(' + ')}`.trim()).join('\n');
  navigator.clipboard?.writeText(t).then(()=>alert('未購入の項目をコピーしました'),()=>prompt('コピーしてください',t))};

// data
$('#exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download=`献立_${ymd(new Date())}.json`;a.click()};
$('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.dishes))throw 0;
  S={plan:{},checked:{},extras:{},...d};save();render();alert('読み込みました')}catch{alert('読み込めないファイルです')}e.target.value=''};
$('#resetAll').onclick=()=>{if(!confirm('すべてのデータを削除してサンプルに戻しますか？'))return;try{localStorage.removeItem(KEY)}catch(e){}S=load();render()};

function render(){renderWeek();renderDishes();renderShop()}
render();
</script>
</body>
</html>
